<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Option 3 · Gig Poster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Big+Shoulders+Display:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Direction 3 — Gig poster: a screen-printed setlist. Two spot inks on dark stock,
   halftone fills for selection, misregistration for focus, the loop as a turning ring. */
      :root {
        --stock: #262a40; /* indigo poster stock */
        --stock-2: #30354f; /* hover band */
        --ink: #efe9dc; /* off-white underbase ink */
        --ink-dim: #9196ad; /* thinned ink, secondary text */
        --pink: #ff5c9d; /* fluorescent pink spot ink */
        --cyan: #3cc0f2; /* cyan spot ink */
        --line: #464b68; /* print rules */
        --font-display: 'Big Shoulders Display', sans-serif;
        --font-body: 'Atkinson Hyperlegible Next', sans-serif;
        --misreg: 3px; /* layer offset for the second ink */
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--stock);
        color: var(--ink);
        font: 400 14px/1.45 var(--font-body);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
        overflow: hidden;
      }
      /* paper tooth */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.07;
        background-image: radial-gradient(#fff 0.6px, transparent 0.7px);
        background-size: 5px 5px;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      /* ---------- Ink-block buttons ---------- */
      .btn {
        position: relative;
        height: 34px;
        padding: 0 14px;
        cursor: pointer;
        background: transparent;
        border: 2px solid var(--ink);
        border-radius: 0;
        font: 700 13px var(--font-body);
        white-space: nowrap;
        box-shadow: 0 0 0 transparent;
        transition:
          box-shadow 0.12s,
          transform 0.12s;
      }
      .btn:hover {
        box-shadow: var(--misreg) var(--misreg) 0 var(--pink);
        transform: translate(calc(var(--misreg) * -0.5), calc(var(--misreg) * -0.5));
      }
      .btn:active {
        box-shadow: none;
        transform: none;
      }
      .btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }
      .btn.solid {
        background: var(--pink);
        border-color: var(--pink);
        color: var(--stock);
      }
      .btn.solid:hover {
        box-shadow: var(--misreg) var(--misreg) 0 var(--cyan);
      }
      .btn.sq {
        width: 34px;
        padding: 0;
        font-size: 16px;
      }
      .btn.ghost {
        border-color: transparent;
      }
      .btn.ghost:hover {
        border-color: var(--ink);
      }
      .btn.warn {
        border-color: var(--pink);
        color: var(--pink);
      }

      /* ---------- Header ---------- */
      header {
        display: flex;
        align-items: flex-end;
        gap: 24px;
        padding: 18px 28px 14px;
        border-bottom: 2px solid var(--ink);
      }
      .mast {
        font: 900 44px/0.82 var(--font-display);
        letter-spacing: -0.01em;
        margin: 0;
      }
      .mast span {
        color: var(--pink);
        display: block;
      }
      .card {
        color: var(--ink-dim);
        font-size: 12.5px;
        padding-bottom: 2px;
        min-width: 0;
      }
      .card b {
        color: var(--ink);
        font-weight: 600;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .toolbar {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
        flex: none;
      }
      .toolbar .rule {
        width: 2px;
        height: 22px;
        background: var(--line);
        margin: 0 4px;
      }

      /* ---------- Main: setlist + now ---------- */
      main {
        display: grid;
        grid-template-columns: 1fr 400px;
        min-height: 0;
      }
      .setlist {
        overflow-y: auto;
        padding: 8px 0 24px;
      }
      .listbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 28px;
        color: var(--ink-dim);
      }
      .listbar b {
        color: var(--ink);
      }
      .link {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        font-weight: 700;
        color: var(--cyan);
      }

      .song {
        display: grid;
        grid-template-columns: 28px 74px 1fr auto 40px;
        align-items: center;
        gap: 14px;
        padding: 6px 28px;
        cursor: pointer;
        position: relative;
      }
      .song:hover {
        background: var(--stock-2);
      }
      .song .n {
        font: 900 46px/1 var(--font-display);
        color: transparent;
        -webkit-text-stroke: 1.5px var(--ink-dim);
        font-variant-numeric: tabular-nums;
      }
      .song .t {
        font: 700 30px/1 var(--font-display);
        letter-spacing: 0.005em;
      }
      .song .t.blank {
        color: var(--ink-dim);
        font-weight: 700;
      }
      .song .m {
        color: var(--ink-dim);
        font-size: 12.5px;
        margin-top: 4px;
      }
      .song .bpm {
        font: 700 22px/1 var(--font-display);
        text-align: right;
      }
      .song .bpm small {
        display: block;
        font: 400 11.5px var(--font-body);
        color: var(--ink-dim);
      }
      /* focus = misregistered second ink */
      .song.focus .n {
        color: var(--pink);
        -webkit-text-stroke: 0;
      }
      .song.focus .t {
        color: var(--ink);
        text-shadow: var(--misreg) 2px 0 var(--cyan);
      }
      /* selection = halftone fill */
      .song.sel {
        background-image: radial-gradient(rgba(60, 192, 242, 0.33) 1.3px, transparent 1.6px);
        background-size: 7px 7px;
      }
      .song .flags {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .flag {
        font: 700 11px var(--font-body);
        padding: 1px 6px;
        border: 1.5px solid var(--ink-dim);
        color: var(--ink-dim);
      }
      .flag.on {
        border-color: var(--cyan);
        color: var(--cyan);
      }
      .flag.rev.on {
        border-color: var(--pink);
        color: var(--pink);
      }
      .box {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 2px solid var(--ink-dim);
        margin: 0;
        cursor: pointer;
        display: grid;
        place-content: center;
        background: transparent;
      }
      .box:checked {
        border-color: var(--cyan);
        background: var(--cyan);
      }
      .box:checked::after {
        content: '';
        width: 8px;
        height: 8px;
        background: var(--stock);
      }
      .playbtn {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 2px solid var(--ink);
        background: transparent;
        cursor: pointer;
        display: grid;
        place-content: center;
        padding-left: 3px;
        font-size: 12px;
      }
      .playbtn:hover {
        background: var(--ink);
        color: var(--stock);
      }

      /* ---------- Now panel ---------- */
      .now {
        border-left: 2px solid var(--ink);
        overflow-y: auto;
        padding: 22px 26px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .ringwrap {
        position: relative;
        width: 100%;
        max-width: 300px;
        aspect-ratio: 1;
        align-self: center;
      }
      .ringwrap svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .ring-center {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .ring-center b {
        font: 900 76px/0.85 var(--font-display);
        color: var(--ink);
      }
      .ring-center span {
        color: var(--ink-dim);
        font-size: 12.5px;
      }
      #sweep {
        transform-origin: 150px 150px;
        animation: spin var(--loop, 20s) linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .now h2 {
        margin: 0;
        font: 900 40px/0.95 var(--font-display);
      }
      .now .dir {
        color: var(--ink-dim);
        margin-top: 4px;
      }
      .credits {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 16px;
        margin: 0;
      }
      .credits dt {
        color: var(--ink-dim);
      }
      .credits dd {
        margin: 0;
        font-weight: 600;
      }
      .phrase {
        display: grid;
        grid-template-columns: 1fr 38px;
        gap: 6px 12px;
        align-items: center;
        border-top: 2px solid var(--line);
        padding-top: 10px;
      }
      .phrase .ph-t {
        font: 700 20px var(--font-display);
      }
      .phrase .ph-t small {
        font: 400 12.5px var(--font-body);
        color: var(--ink-dim);
        margin-left: 8px;
      }
      .phrase svg {
        grid-column: 1 / -1;
        width: 100%;
        height: 30px;
        display: block;
      }
      .actions {
        display: flex;
        gap: 10px;
      }

      /* ---------- Footer ---------- */
      footer {
        border-top: 2px solid var(--ink);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 18px;
        align-items: center;
        padding: 10px 28px 12px;
        position: relative;
      }
      .progress {
        position: absolute;
        left: 0;
        top: -2px;
        height: 4px;
        background: var(--pink);
        width: 35%;
      }
      .np {
        font: 700 20px/1 var(--font-display);
      }
      .np small {
        display: block;
        font: 400 12px var(--font-body);
        color: var(--ink-dim);
        margin-top: 3px;
      }
      .tc {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .time {
        font: 700 22px var(--font-display);
        font-variant-numeric: tabular-nums;
        margin-left: 8px;
      }
      .time span {
        color: var(--ink-dim);
      }
      .vol {
        justify-self: end;
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--ink-dim);
      }
      input[type='range'] {
        accent-color: var(--pink);
        width: 140px;
      }

      @media (max-width: 960px) {
        body {
          height: auto;
          overflow: auto;
        }
        header {
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .toolbar {
          margin-left: 0;
          flex-wrap: wrap;
        }
        main {
          grid-template-columns: 1fr;
        }
        .now {
          border-left: 0;
          border-top: 2px solid var(--ink);
        }
        .song {
          grid-template-columns: 24px 52px 1fr 40px;
          padding: 6px 16px;
        }
        .song .bpm {
          display: none;
        }
        .song .n {
          font-size: 34px;
        }
        .song .t {
          font-size: 24px;
        }
        footer {
          grid-template-columns: 1fr;
          padding: 10px 16px;
        }
        .vol {
          justify-self: start;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #sweep {
          animation: none;
        }
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="mast">JamMan<span>Manager</span></h1>
      <div class="card"><b>/Volumes/JAMMAN/JamManStereo</b>412.6 MB on card</div>
      <nav class="toolbar" aria-label="Actions">
        <button class="btn">Load SD card</button>
        <button class="btn sq ghost" aria-label="Undo" title="Undo (Cmd+Z)">↶</button>
        <button class="btn sq ghost" aria-label="Redo" title="Redo (Cmd+Shift+Z)" disabled>
          ↷
        </button>
        <span class="rule"></span>
        <button class="btn">Sort</button>
        <button class="btn">Export</button>
        <button class="btn">Backup</button>
        <button class="btn">Setlists</button>
        <span class="rule"></span>
        <button class="btn solid">New patch</button>
      </nav>
    </header>

    <main>
      <section class="setlist" aria-label="Patches">
        <div class="listbar">
          <span id="selinfo"></span
          ><span style="display: flex; gap: 16px; align-items: center"
            ><button class="btn warn" id="del" style="height: 28px">Delete selected</button
            ><button class="link" id="selall"></button
          ></span>
        </div>
        <div id="songs"></div>
      </section>
      <aside class="now" id="now" aria-label="Patch detail"></aside>
    </main>

    <footer>
      <div class="progress" aria-hidden="true"></div>
      <div class="np">Verse groove<small>Patch02, Phrase01</small></div>
      <div class="tc">
        <button class="btn sq" aria-label="Stop">■</button>
        <button class="btn sq solid" aria-label="Pause">❚❚</button>
        <span class="time">0:07 <span>/ 0:20</span></span>
      </div>
      <label class="vol">Level <input type="range" value="70" /></label>
    </footer>

    <script>
      const RHYTHM_LABEL = {
        Silence: 'Silence',
        WoodBlocks: 'Wood blocks',
        Sticks: 'Sticks',
        Click: 'Click',
        AlternativeKickAndHighHat: 'Alt. kick + hat',
        StudioKickAndHighHat: 'Studio kick + hat',
        TechnoKickAndHighHat: 'Techno kick + hat',
        Cowbell: 'Cowbell',
        Conga: 'Conga',
        Tambourine: 'Tambourine',
      };
      const STOPS = {
        StopInstantly: 'Instantly',
        StopAtEndOfLoop: 'At end of loop',
        FadeOut: 'Fade out',
      };
      const P = (slot, name, rhythm, stop, phrases) => ({ slot, name, rhythm, stop, phrases });
      const ph = (bpm, ts, loop, rev, dur) => ({ bpm, ts, loop, rev, dur });
      const patches = [
        P(1, 'Intro drone', 'Silence', 'FadeOut', [ph(72, 4, 1, 0, '0:42')]),
        P(2, 'Verse groove', 'StudioKickAndHighHat', 'StopAtEndOfLoop', [
          ph(96, 4, 1, 0, '0:20'),
          ph(96, 4, 1, 0, '0:10'),
        ]),
        P(3, 'Chorus wall', 'Click', 'StopAtEndOfLoop', [ph(96, 4, 1, 0, '0:20')]),
        P(5, 'Funk 16ths', 'Conga', 'StopInstantly', [ph(104, 4, 1, 0, '0:09')]),
        P(6, 'Backwards swell', 'Silence', 'FadeOut', [ph(80, 4, 1, 1, '0:24')]),
        P(7, 'Bridge in 6/8', 'Tambourine', 'StopAtEndOfLoop', [
          ph(66, 6, 1, 0, '0:16'),
          ph(66, 6, 0, 0, '0:05'),
        ]),
        P(9, '', 'Click', 'StopInstantly', [ph(120, 4, 1, 0, '0:08')]),
        P(12, 'Outro ambient', 'WoodBlocks', 'FadeOut', [ph(60, 4, 1, 0, '1:04')]),
        P(14, 'Bass loop Dm', 'Sticks', 'StopAtEndOfLoop', [ph(88, 4, 1, 0, '0:11')]),
        P(21, 'Jam in A', 'TechnoKickAndHighHat', 'StopAtEndOfLoop', [ph(124, 4, 1, 0, '0:15')]),
        P(22, 'Cowbell fever', 'Cowbell', 'StopInstantly', [ph(110, 4, 1, 0, '0:13')]),
        P(40, 'Practice 70', 'Click', 'StopInstantly', [ph(70, 4, 1, 0, '0:27')]),
      ];
      const pad = n => String(n).padStart(2, '0');
      const secs = d => {
        const [m, s] = d.split(':').map(Number);
        return m * 60 + s;
      };
      function rand(seed) {
        let s = seed * 9301 + 49297;
        return () => (s = (s * 9301 + 49297) % 233280) / 233280;
      }

      // Halftone waveform: dot size follows amplitude
      function halftone(seed, color) {
        const r = rand(seed);
        let dots = '';
        for (let i = 0; i < 64; i++) {
          const env = Math.sin((Math.PI * i) / 64) * 0.65 + 0.35,
            a = r() * env;
          for (let row = 0; row < 3; row++)
            dots += `<circle cx="${i * 5 + 2.5}" cy="${row * 10 + 5}" r="${Math.max(0.4, a * (row === 1 ? 4.2 : 2.6))}" fill="${color}"/>`;
        }
        return `<svg viewBox="0 0 320 30" preserveAspectRatio="none" aria-hidden="true">${dots}</svg>`;
      }
      // Loop ring: one tick per beat across the loop, a pink sweep for the playhead
      function ring(p) {
        const f = p.phrases[0],
          beats = Math.max(4, Math.round((secs(f.dur) * f.bpm) / 60));
        let ticks = '';
        for (let i = 0; i < beats; i++) {
          const a = (i / beats) * Math.PI * 2,
            down = i % f.ts === 0;
          const r1 = down ? 118 : 124,
            r2 = 134;
          ticks += `<line x1="${150 + Math.sin(a) * r1}" y1="${150 - Math.cos(a) * r1}" x2="${150 + Math.sin(a) * r2}" y2="${150 - Math.cos(a) * r2}" stroke="${down ? '#efe9dc' : '#6c7192'}" stroke-width="${down ? 3 : 1.6}"/>`;
        }
        return `<svg viewBox="0 0 300 300" aria-hidden="true">
    <circle cx="150" cy="150" r="142" fill="none" stroke="#464b68" stroke-width="2"/>${ticks}
    <g id="sweep"><path d="M150 4 A146 146 0 0 1 270 66" fill="none" stroke="#ff5c9d" stroke-width="8"/><circle cx="150" cy="4" r="5" fill="#ff5c9d"/></g>
    <circle cx="153" cy="152" r="98" fill="none" stroke="#3cc0f2" stroke-width="1.5" opacity=".7"/>
  </svg>`;
      }

      let focus = 2,
        selected = new Set([5, 6]);
      function render() {
        document.getElementById('selinfo').innerHTML = selected.size
          ? `<b>${selected.size} selected</b>`
          : `<b>${patches.length}</b> of 99 slots in use`;
        document.getElementById('del').style.visibility = selected.size ? 'visible' : 'hidden';
        document.getElementById('selall').textContent = selected.size
          ? 'Clear selection'
          : 'Select all';
        document.getElementById('songs').innerHTML = patches
          .map(p => {
            const f = p.phrases[0],
              s = p.slot;
            return `<div class="song ${s === focus ? 'focus' : ''} ${selected.has(s) ? 'sel' : ''}" data-slot="${s}">
      <input type="checkbox" class="box" data-sel="${s}" ${selected.has(s) ? 'checked' : ''} aria-label="Select Patch${pad(s)}"/>
      <span class="n">${pad(s)}</span>
      <div><div class="t ${p.name ? '' : 'blank'}">${p.name || 'Untitled'}</div>
        <div class="m">${RHYTHM_LABEL[p.rhythm]}, stops ${STOPS[p.stop].toLowerCase()}, ${p.phrases.length} phrase${p.phrases.length > 1 ? 's' : ''}</div></div>
      <div class="bpm">${f.bpm}<small>bpm, ${f.ts}/4</small></div>
      <button class="playbtn" aria-label="Play Patch${pad(s)}">▶</button>
    </div>`;
          })
          .join('');

        const p = patches.find(x => x.slot === focus),
          f = p.phrases[0];
        const now = document.getElementById('now');
        now.style.setProperty('--loop', `${secs(f.dur)}s`);
        now.innerHTML = `
    <div class="ringwrap">${ring(p)}<div class="ring-center"><b>${f.bpm}</b><span>bpm in ${f.ts}/4, ${f.dur} loop</span></div></div>
    <div><h2>${p.name || 'Untitled'}</h2><div class="dir">Patch${pad(p.slot)}</div></div>
    <dl class="credits">
      <dt>Rhythm</dt><dd>${RHYTHM_LABEL[p.rhythm]}</dd>
      <dt>Stops</dt><dd>${STOPS[p.stop]}</dd>
      <dt>Playback</dt><dd><span class="flags" style="display:inline-flex;margin:0"><span class="flag ${f.loop ? 'on' : ''}">Loop</span><span class="flag rev ${f.rev ? 'on' : ''}">Reverse</span></span></dd>
    </dl>
    <div>${p.phrases
      .map(
        (q, i) => `<div class="phrase">
      <span class="ph-t">Phrase${pad(i + 1)}<small>${q.bpm} bpm, ${q.dur}</small></span>
      <button class="playbtn" aria-label="Play phrase">▶</button>
      ${halftone(p.slot * 3 + i, i ? '#3cc0f2' : '#ff5c9d')}</div>`,
      )
      .join('')}</div>
    <div class="actions"><button class="btn solid">Edit patch</button><button class="btn warn">Delete</button></div>`;
      }
      document.addEventListener('click', e => {
        const sel = e.target.closest('[data-sel]');
        if (sel) {
          const s = +sel.dataset.sel;
          selected.has(s) ? selected.delete(s) : selected.add(s);
          render();
          return;
        }
        if (e.target.closest('.playbtn, .btn')) return;
        const row = e.target.closest('.song');
        if (row) {
          focus = +row.dataset.slot;
          render();
        }
        if (e.target.id === 'selall') {
          selected = selected.size ? new Set() : new Set(patches.map(p => p.slot));
          render();
        }
      });
      render();
    </script>
  </body>
</html>
