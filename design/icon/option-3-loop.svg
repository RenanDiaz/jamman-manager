<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>JamMan Manager, option 3: loop LEDs</title>
<defs>
<filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
  <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.38"/>
</filter>
<filter id="segGlow" x="-50%" y="-50%" width="200%" height="200%">
  <feGaussianBlur stdDeviation="0.45" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="ledGlow" x="-100%" y="-100%" width="300%" height="300%">
  <feGaussianBlur stdDeviation="14" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2a4fb0"/><stop offset="0.45" stop-color="#1f3d93"/><stop offset="1" stop-color="#18337f"/>
</linearGradient>
<pattern id="flake" width="9" height="9" patternUnits="userSpaceOnUse">
  <circle cx="2" cy="2" r="0.9" fill="#fff" opacity="0.10"/>
  <circle cx="6.5" cy="6" r="1" fill="#0a1440" opacity="0.22"/>
</pattern>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
  <stop offset="0.9" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.35"/>
</linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#24262c"/><stop offset="1" stop-color="#131417"/>
</linearGradient>
<radialGradient id="chrome" cx="0.38" cy="0.32" r="0.75">
  <stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#d3d0c8"/><stop offset="1" stop-color="#7f7c75"/>
</radialGradient>
<radialGradient id="screw" cx="0.35" cy="0.35" r="0.7">
  <stop offset="0" stop-color="#55585f"/><stop offset="1" stop-color="#0c0d0f"/>
</radialGradient>
</defs>
<g filter="url(#drop)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#panel)"/></g>
<rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="4"/>
