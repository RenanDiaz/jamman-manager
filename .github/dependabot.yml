version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Maintain dependencies for npm.
  # Minor and patch updates arrive as one grouped PR per week; major updates
  # stay as individual PRs so their breaking changes can be reviewed on their own.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
